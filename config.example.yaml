# 電子紙看板設定（改完執行：sudo systemctl restart einkboard）

location:
  name: 台北              # 顯示在天氣旁邊
  lat: 25.0330            # 你的座標（Google 地圖按右鍵可複製）
  lon: 121.5654
  tz: Asia/Taipei

pages: [clock, power, market]     # 輪播順序，不要的拿掉
rotate_minutes: 5                 # 每頁停留分鐘數

night:                            # 夜間時段：畫一次固定畫面後停止刷新
  enabled: true
  start: "23:30"
  end: "07:00"
  page: night                     # night = 晚安；off = 下班了（「明天／下週一 09:00 見」＋明天天氣）
  off_back: "09:00"               # 選 off 時：幾點回來
  off_note: ""                    # 選 off 時：留言（選填）

market:
  stocks: ["t00", "2330", "0050"]    # 台股代號，上市上櫃 ETF 都可以，最多 4 檔；t00 = 加權指數、o00 = 櫃買指數
  fx: [USD, JPY, VND]                 # 對新台幣，最多 3 種（越南盾、韓元會自動換成每萬元）；open.er-api 每日參考匯率
  fx_refresh_minutes: 30

eink:
  driver: heltec290               # Heltec 2.9"；Waveshare 模組改成 epd2in9_V2
  full_refresh_every: 0           # 每 N 次更新全刷一次（0 = 關閉）
  full_refresh_minutes: 60        # 每隔幾分鐘全刷一次清殘影（60 = 整點；10 = 每 10 分鐘）
  page_change_full: true          # 換頁時全刷：閃一下但完全沒殘影；false = 換頁也用局部刷新（會留淡淡殘影）
  lut_tp: 20                      # 局部波形強度（einktest --ghost 實測最佳：設定 B）
  lut_rp: 0
  rotate180: false                # 畫面上下顛倒就改 true
  invert: false                   # 黑白顛倒（黑底白字）就改 true
  partial_mode: lut_cc            # 局部刷新方式：gx_cc / otp_c4 / otp_ff，跑 einktest --modes 會告訴你選哪個
  has_reset_pin: false            # Heltec 7 腳模組（VCC GND D/C SDI CS CLK BUSY）沒有 RST → false
                                  # 有 RST 腳的模組（Waveshare 8/9 腳）改 true，夜間可深度睡眠

web:                              # 設定網頁：http://<Pi 的 IP>:8080（沒有密碼，同網路都打得開）
  enabled: true
  port: 8080

simulate: false                   # true = 不接螢幕，畫面存成 /tmp/einkboard/eink.png
