# 電子紙看板設定（改完執行：sudo systemctl restart einkboard）

location:
  name: 台北              # 顯示在天氣旁邊
  lat: 25.0330            # 你的座標（Google 地圖按右鍵可複製）
  lon: 121.5654
  tz: Asia/Taipei

pages: [clock, power, market]     # 輪播順序，不要的拿掉
rotate_minutes: 2                 # 每頁停留分鐘數

night:                            # 夜間顯示「晚安」後停止刷新
  enabled: true
  start: "23:30"
  end: "07:00"

market:
  stocks: ["2330", "0050", "2308"]   # 台股代號，上市上櫃 ETF 都可以，最多 4 檔
  fx: [USD, JPY, VND]                 # 對新台幣，最多 3 種（越南盾、韓元會自動換成每萬元）；open.er-api 每日參考匯率
  fx_refresh_minutes: 30

eink:
  driver: heltec290               # Heltec 2.9"；Waveshare 模組改成 epd2in9_V2
  full_refresh_every: 30          # 每 N 次局部刷新做一次全刷（清殘影）；整點也會全刷
  rotate180: false                # 畫面上下顛倒就改 true
  invert: false                   # 黑白顛倒（黑底白字）就改 true
  has_reset_pin: false            # Heltec 7 腳模組（VCC GND D/C SDI CS CLK BUSY）沒有 RST → false
                                  # 有 RST 腳的模組（Waveshare 8/9 腳）改 true，夜間可深度睡眠

simulate: false                   # true = 不接螢幕，畫面存成 /tmp/einkboard/eink.png
